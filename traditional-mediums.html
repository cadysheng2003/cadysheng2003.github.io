(function(){
  function buildTMMobile(){
    if(window.innerWidth > 767 || !(navigator.maxTouchPoints > 0 || matchMedia('(pointer:coarse)').matches)) return;
    if(document.querySelector('.tm-mobile-built')) return;

    var gallery = document.querySelector('.gallery');
    if(!gallery) return;

    /* Get element by data-tm attribute */
    function get(tm){ return document.querySelector('[data-tm="'+tm+'"]'); }

    /* For abs-positioned containers: extract real img src and build clean .g wrapper */
    function cleanImgWrap(tm){
      var el = get(tm);
      if(!el) return null;
      var imgs = Array.from(el.querySelectorAll('img'));
      /* Prefer the abs-positioned real image; fallback to any non-hidden img */
      var real = imgs.find(function(i){
        var s = i.getAttribute('style') || '';
        return s.indexOf('position:absolute') !== -1 || s.indexOf('position: absolute') !== -1;
      });
      if(!real){
        real = imgs.find(function(i){
          return (i.getAttribute('style')||'').indexOf('visibility:hidden') === -1;
        });
      }
      if(!real) return null;
      var wrap = document.createElement('div');
      wrap.className = 'g';
      wrap.setAttribute('data-title', el.getAttribute('data-title') || '');
      var img = new Image();
      img.src = real.src;
      img.alt = real.alt || '';
      img.loading = 'lazy';
      img.style.cssText = 'width:100%;height:auto;display:block;';
      wrap.appendChild(img);
      return wrap;
    }

    /* For abs-positioned containers: extract video and build clean wrapper */
    function cleanVideoWrap(tm){
      var el = get(tm);
      if(!el) return null;
      var vid = el.querySelector('video');
      if(!vid) return null;
      var wrap = document.createElement('div');
      wrap.className = 'g tm-s7-video';
      var v = document.createElement('video');
      v.src = vid.src;
      v.autoplay = true;
      v.muted = true;
      v.loop = true;
      v.setAttribute('playsinline','');
      v.style.cssText = 'width:100%;display:block;';
      wrap.appendChild(v);
      return wrap;
    }

    /* ── VERIFY all required nodes exist before touching DOM ── */
    var s1ids = ['TM1','TM2','TM3'];
    var s2ids = ['TM5','TM8','TM11','TM12','TM13','TM14','TM15','TM16'];
    var s3ids = ['TM6','TM19','TM4','TM7'];
    var s4ids = ['TM18','TM20','TM21'];
    var s5ids = ['TM22','TM23'];
    var s6ids = ['TM9','TM17'];

    var ok = true;
    s1ids.concat(s2ids).concat(s6ids).forEach(function(tm){ if(!get(tm)) ok=false; });
    /* s3: TM6,TM4,TM7 are plain nodes; TM19 is abs-positioned */
    ['TM6','TM4','TM7'].forEach(function(tm){ if(!get(tm)) ok=false; });
    if(!cleanImgWrap('TM19')) ok=false;
    /* s4: TM18/TM20 are abs-positioned, TM21 is plain */
    ['TM18','TM20'].forEach(function(tm){ if(!cleanImgWrap(tm)) ok=false; });
    if(!get('TM21')) ok=false;
    /* s5: TM22/TM23 are abs-positioned */
    s5ids.forEach(function(tm){ if(!cleanImgWrap(tm)) ok=false; });
    /* s7: TM10 is video */
    if(!cleanVideoWrap('TM10')) ok=false;
    if(!ok) return;

    /* ── BUILD SECTIONS ── */

    /* S1: TM1, TM2, TM3 — full, stacked */
    var s1 = document.createElement('div');
    s1.className = 'tm-s1';
    s1ids.forEach(function(tm){ s1.appendChild(get(tm)); });

    /* S2: TM5,TM8,TM11–TM16 — 4×2 grid */
    var s2 = document.createElement('div');
    s2.className = 'tm-s2';
    s2ids.forEach(function(tm){ s2.appendChild(get(tm)); });

    /* S3: TM6, TM19, TM4, TM7 — full, stacked
       TM6/TM4/TM7 are plain nodes (move directly)
       TM19 is abs-positioned (use cleanImgWrap, hide original) */
    var s3 = document.createElement('div');
    s3.className = 'tm-s3';
    s3.appendChild(get('TM6'));
    var tm19wrap = cleanImgWrap('TM19'); s3.appendChild(tm19wrap); get('TM19').style.display='none';
    s3.appendChild(get('TM4'));
    s3.appendChild(get('TM7'));

    /* S4: TM18, TM20, TM21 — 3-col grid
       TM18/TM20 are abs-positioned → cleanImgWrap + hide original
       TM21 is a plain node → move directly */
    var s4 = document.createElement('div');
    s4.className = 'tm-s4';
    ['TM18','TM20'].forEach(function(tm){
      s4.appendChild(cleanImgWrap(tm));
      get(tm).style.display='none';
    });
    s4.appendChild(get('TM21'));

    /* S5: TM22, TM23 — 2-col grid (abs-positioned, use clean copies) */
    var s5 = document.createElement('div');
    s5.className = 'tm-s5';
    s5ids.forEach(function(tm){
      s5.appendChild(cleanImgWrap(tm));
      get(tm).style.display='none';
    });

    /* S6: TM9, TM17 — each full width, own row */
    var s6 = document.createElement('div');
    s6.className = 'tm-s6';
    s6ids.forEach(function(tm){ s6.appendChild(get(tm)); });

    /* S7: TM10 video — full width, half natural height via object-fit+container */
    var s7 = document.createElement('div');
    s7.className = 'tm-s7';
    s7.appendChild(cleanVideoWrap('TM10'));
    get('TM10').style.display='none';

    /* S8: remaining images not in any section — TM24, TM25, TM26, TM27
       each full width, single row. Extract clean img for abs-positioned ones. */
    var s8 = document.createElement('div');
    s8.className = 'tm-s8';
    ['TM24','TM25','TM26','TM27'].forEach(function(tm){
      var el = get(tm);
      if(!el) return;
      /* Check if abs-positioned (has visibility:hidden spacer img) */
      var imgs = Array.from(el.querySelectorAll('img'));
      var hasAbsImg = imgs.some(function(i){
        return (i.getAttribute('style')||'').indexOf('position:absolute') !== -1
          || (i.getAttribute('style')||'').indexOf('position: absolute') !== -1;
      });
      if(hasAbsImg){
        var w = cleanImgWrap(tm);
        if(w){ s8.appendChild(w); el.style.display='none'; }
      } else {
        s8.appendChild(el);
      }
    });

    /* ── VERIFY counts ── */
    if(s1.children.length !== 3) return;
    if(s2.children.length !== 8) return;
    if(s3.children.length !== 4) return;
    if(s4.children.length !== 3) return;
    if(s5.children.length !== 2) return;
    if(s6.children.length !== 2) return;
    if(s7.children.length !== 1) return;
    /* s8 count not verified — flexible, shows whatever remains */

    /* ── INSERT all sections at top of gallery in order ── */
    [s8,s7,s6,s5,s4,s3,s2,s1].forEach(function(s){
      gallery.insertBefore(s, gallery.firstChild);
    });

    /* ── HIDE original structural containers now emptied ── */
    gallery.querySelectorAll('.tm3col').forEach(function(el){ el.style.display='none'; });
    gallery.querySelectorAll('.tm-fig-row').forEach(function(el){ el.style.display='none'; });
    gallery.querySelectorAll('.sep-sm').forEach(function(el){ el.style.display='none'; });
    gallery.querySelectorAll('.sep').forEach(function(el){ el.style.display='none'; });

    /* Hide .r rows by walking each element's ancestors up to the row,
       checking for display:none set by JS — more reliable than querySelector */
    gallery.querySelectorAll('.r').forEach(function(row){
      var visibleContent = Array.from(row.querySelectorAll('img, video')).filter(function(node){
        if((node.getAttribute('style')||'').indexOf('visibility:hidden') !== -1) return false;
        var cur = node;
        while(cur && cur !== row){
          var s = cur.getAttribute('style') || '';
          if(s.indexOf('display:none') !== -1 || s.indexOf('display: none') !== -1) return false;
          cur = cur.parentElement;
        }
        return true;
      });
      if(visibleContent.length === 0) row.style.display='none';
    });

    gallery.classList.add('tm-mobile-built');
  }

  document.addEventListener('DOMContentLoaded', buildTMMobile);
})();
</script>
</body>
</html>
