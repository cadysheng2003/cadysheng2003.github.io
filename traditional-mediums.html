<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traditional Mediums — Cady Sheng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body:    'Lora', Georgia, serif;
      --color-text:       #2a2a2a;
      --color-text-light: #888;
      --page-max-width:   960px;
      --page-padding:     40px;
      --gap:              8px;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body { background:#fff; color:var(--color-text); }

    .gallery { max-width:var(--page-max-width); margin:0 auto; padding:0 var(--page-padding); }
    .r  { display:flex; gap:var(--gap); margin-bottom:var(--gap); align-items:flex-start; }
    .c  { display:flex; flex-direction:column; gap:var(--gap); min-width:0; }
    .g  { display:block; line-height:0; cursor:pointer; min-width:0; }
    .g img   { display:block; width:100%; height:auto; transition:opacity 0.3s ease; }
    .g { border-radius:8px; overflow:hidden; }
    .g img { border-radius:8px; }
    .g video { display:block; width:100%; height:auto; }
    .g:hover img { opacity:0.88; }
    .g2 { display:grid; grid-template-columns:1fr 1fr; gap:var(--gap); }
    .g3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:var(--gap); }
    .sep    { height:40px; }
    .sep-sm { height:20px; }

    .page-header { max-width:var(--page-max-width); margin:40px auto 32px; padding:0 var(--page-padding); }
    .page-title  { font-family:var(--font-display); font-size:32px; font-weight:400; letter-spacing:0.5px; text-align:center; }

    .intro-text { max-width:var(--page-max-width); margin:0 auto 36px; padding:0 var(--page-padding); }
    .intro-text p { font-family:var(--font-body); font-size:14px; line-height:1.8; color:var(--color-text-light); margin-bottom:10px; padding-left:24px; }

    .page-nav { max-width:var(--page-max-width); margin:56px auto 52px; padding:0 var(--page-padding); display:flex; justify-content:space-between; align-items:center; }
    .page-nav__side { display:flex; flex-direction:column; align-items:flex-start; gap:6px; min-width:140px; }
    .page-nav__side--right { align-items:flex-end; }
    .page-nav__label { font-family:var(--font-body); font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:#a89f98; }
    .page-nav__name  { font-family:var(--font-display); font-size:15px; font-weight:400; color:var(--color-text-light); text-decoration:none; letter-spacing:0.3px; transition:color 0.25s; }
    .page-nav__name:hover { color:var(--color-text); }
    .page-nav__home  { font-family:var(--font-display); font-size:30px; font-weight:300; color:var(--color-text); letter-spacing:2px; text-decoration:none; transition:opacity 0.25s; }
    .page-nav__home:hover { opacity:0.6; }



    @media (max-width:600px) {
      :root { --page-padding:18px; }
      .r { flex-direction:column; gap:12px; }
      .r > .c, .r > .g { width:100% !important; flex:none !important; }
      .g3 { grid-template-columns:1fr 1fr; }
      .page-nav { flex-direction:column; gap:24px; align-items:center; }
      .page-nav__side, .page-nav__side--right { align-items:center; }
      /* 3-col layout → single col */
      .tm3col { flex-direction:column !important; }
      .tm-l, .tm-m, .tm-r { flex:none !important; width:100% !important; }
      /* Title image */
      .page-header img { height:auto !important; width:75% !important; max-width:300px !important; }
    }

    .tm3col { display:flex; gap:8px; margin-bottom:8px; align-items:flex-start; }
    .tm-l { flex:1.744 0 0; display:flex; flex-direction:column; gap:8px; min-width:0; }
    .tm-m { flex:1.317 0 0; display:flex; flex-direction:column; gap:8px; min-width:0; }
    .tm-r { flex:1.000 0 0; display:flex; flex-direction:column; gap:8px; min-width:0; }

    @media(max-width:767px) and (pointer:coarse){
            /* TM mobile custom layout */
      .tm-mob-top{
        display:flex;
        flex-direction:column;
        gap:12px;
        margin-bottom:12px;
      }
      .tm-mob-figs{
        display:grid;
        grid-template-columns:1fr 1fr 1fr 1fr;
        gap:3px;
        margin-bottom:4px;
      }
      .tm-mob-top .g{
        width:100%;
        flex:none !important;
      }
      .tm-mob-top .g img{
        width:100% !important;
        height:auto !important;
        object-fit:unset !important;
        display:block;
      }
      .tm-mob-figs .g{
        width:100%;
        flex:none !important;
      }
      /* Hide empty original containers after JS moves elements */
      .tm-fig-moved{ display:none !important; }

      /* TM top section: 3-column grid for tm3col */
      .tm3col{
        display:grid !important;
        grid-template-columns:1fr 1fr 1fr !important;
        gap:4px !important;
        flex-direction:unset !important;
      }
      .tm-l, .tm-m, .tm-r{
        width:100% !important;
        flex:none !important;
        display:flex;
        flex-direction:column;
        gap:4px;
      }

      /* Override 600px page-nav column layout → horizontal row on mobile */
      .page-nav{
        flex-direction:row !important;
        align-items:center !important;
        gap:0 !important;
        width:100%;
        box-sizing:border-box;
        padding:0 16px;
        margin:24px 0 20px;
      }
      .page-nav__side,
      .page-nav__side--right{
        flex:0 0 40%;
        width:40%;
        min-width:0;
        display:flex;
        flex-direction:column;
        gap:2px;
        box-sizing:border-box;
      }
      .page-nav__side{ align-items:flex-start !important; padding-right:8px; }
      .page-nav__side--right{ align-items:flex-end !important; padding-left:8px; }
      .page-nav__home{
        flex:0 0 20%;
        width:20%;
        text-align:center;
        font-size:16px;
        padding:0;
        box-sizing:border-box;
      }
      .page-nav__label{ display:none; }
      .page-nav__name{
        font-size:15px;
        line-height:1.3;
        word-break:break-word;
        overflow-wrap:break-word;
        display:block;
        max-width:100%;
      }

      .g, .g img { border-radius:3px !important; overflow:hidden; }
    }
  </style>
</head>

  <script>
  (function(){
    function buildTMMobile(){
      if(window.innerWidth > 767 || !(navigator.maxTouchPoints > 0 || matchMedia('(pointer:coarse)').matches)) return;
      if(document.querySelector('.tm-mobile-built')) return;

      var gallery = document.querySelector('.gallery');
      if(!gallery) return;

      /* Collect all needed elements by data-tm */
      function get(tm){ return document.querySelector('[data-tm="'+tm+'"]'); }

      var tm1=get('TM1'), tm2=get('TM2'), tm3=get('TM3');
      var fig = ['TM5','TM8','TM11','TM12','TM13','TM14','TM15','TM16'].map(get);

      /* Verify we have all required elements */
      if(!tm1||!tm2||!tm3) return;
      if(fig.filter(Boolean).length !== 8) return;

      /* ── Block 1: TM1/TM2/TM3 in 3-col row ── */
      var block1 = document.createElement('div');
      block1.className = 'tm-mob-top';
      [tm1,tm2,tm3].forEach(function(el){ block1.appendChild(el); });

      /* ── Block 2: 8 figure images in 4-col x 2 rows ── */
      var block2 = document.createElement('div');
      block2.className = 'tm-mob-figs';
      fig.forEach(function(el){ block2.appendChild(el); });

      /* ── Prepend both blocks to gallery (before existing content) ── */
      gallery.insertBefore(block2, gallery.firstChild);
      gallery.insertBefore(block1, gallery.firstChild);

      /* Mark as built */
      gallery.classList.add('tm-mobile-built');
    }
    document.addEventListener('DOMContentLoaded', buildTMMobile);
  })();
  </script>
