<style>
  :root {
    --bg: #ffffff;
    --paper: #ffffff;
    --ink: #2a2a2a;
    --muted: #7a7468;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: var(--ink);
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }

  .book-wrap {
    position: relative;
  }

  /* ---------------------------------------------------------------
     THE FIX FOR "BLEEDING PAGES":
     The book container clips everything inside it. No matter what
     transform the library applies during a flip, nothing can render
     outside the book's bounding box. This makes stray DOM elements
     showing up beyond the page edges impossible.

     We also set a clean opaque background so the page area is fully
     covered even before the library lays down its own backgrounds.
     --------------------------------------------------------------- */
  #book {
    overflow: hidden;
    background: var(--bg);
    border-radius: 10px;
    box-shadow: 0 30px 60px -20px rgba(40, 30, 20, 0.18),
                0 18px 30px -15px rgba(40, 30, 20, 0.12);
    transition: box-shadow 0.5s ease, clip-path 0.5s ease;
  }
  /* When only the front or back cover is on stage, the book container is
     still double-page wide but we slide it sideways so the cover sits in
     the centre of the screen. The empty half would otherwise leak its
     drop-shadow across the viewport, so clip it away. */
  .book-wrap.solo-right #book { clip-path: inset(-80px -80px -80px 50%); }
  .book-wrap.solo-left  #book { clip-path: inset(-80px 50% -80px -80px); }

  /* Belt-and-suspenders: also clip stf__parent and stf__block themselves
     in case the library moves things around. */
  .stf__parent,
  .stf__block,
  .stf__wrapper {
    overflow: hidden !important;
  }

  /* Each rendered page: opaque, with hidden backface so the reverse
     side of a flipping page does not show as a mirrored ghost. */
  .page {
    background: #ffffff;
    overflow: hidden;
    position: relative;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .page-empty { background: var(--bg); }

  .page-image {
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-color: #ffffff;
    position: relative;
  }
  /* Round only the OUTER corners of each page so the spine (inner edges)
     stays straight when the two pages meet in the middle. */
  .stf__item.--left  .page-image,
  .stf__item.--left  .cover-page  { border-radius: 10px 0 0 10px; }
  .stf__item.--right .page-image,
  .stf__item.--right .cover-page  { border-radius: 0 10px 10px 0; }

  /* Hide stf__item back face explicitly */
  .stf__item {
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  /* -------- TEXT BUBBLES --------
     Tiny, unobtrusive bubbles. All text uses the exact same font, weight,
     style, and size — no italic/bold variations — so every bubble looks
     uniform across the book. Long words are allowed to break so the text
     never overflows the bubble outline. */
  .text-bubble {
    position: absolute;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 5px 9px;
    pointer-events: none;
    max-width: 193px;
  }
  .text-bubble.bubble-wide  { max-width: 233px; }
  .text-bubble.bubble-tall  { max-width: 153px; }
  .text-bubble.bubble-tiny  { max-width: 80px; padding: 3px 5px; }
  /* "Mini" bubble: roughly one-third the visual size of the default bubble.
     Used for pages where the default bubble feels too dominant. */
  .text-bubble.bubble-mini  { max-width: 64px; padding: 3px 4px; }
  .text-bubble.bubble-mini .copy { font-size: 3.3px; line-height: 1.25; }
  /* "Bigger" bubble: default bubble scaled up by ~1/5. */
  .text-bubble.bubble-bigger { max-width: 232px; padding: 6px 11px; }
  .text-bubble.bubble-bigger .copy { font-size: 11.2px; line-height: 1.3; }
  /* "Wide-bigger": bubble-wide scaled up by ~1/5. */
  .text-bubble.bubble-wide-bigger { max-width: 280px; padding: 6px 11px; }
  .text-bubble.bubble-wide-bigger .copy { font-size: 11.2px; line-height: 1.3; }
  /* P20 closing: long text, ~3/4 of bubble-wide */
  .text-bubble.bubble-p20  { max-width: 130px; padding: 3px 5px; }
  .text-bubble.bubble-p20 .copy { font-size: 5.3px; line-height: 1.3; }
  /* For dense paragraphs that would otherwise overflow the bubble outline */
  .text-bubble.bubble-shrink .copy { font-size: 8px; line-height: 1.25; }

  .text-bubble svg {
    position: absolute;
    inset: -8% -6%;
    width: 112%;
    height: 116%;
    z-index: -1;
    overflow: visible;
    filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.07));
  }
  .text-bubble .copy {
    position: relative;
    z-index: 1;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 9.3px;
    line-height: 1.3;
    color: #2c2a26;
    text-align: center;
    font-weight: 500;
    font-style: normal;
    letter-spacing: 0.005em;
    /* allow long words to break instead of overflowing the bubble */
    word-wrap: break-word;
    overflow-wrap: break-word;
    hyphens: auto;
    -webkit-hyphens: auto;
  }
  /* Unify all inline children — em and .small look identical to body text
     so the whole bubble reads as one consistent typeface. */
  .text-bubble .copy em,
  .text-bubble .copy .small,
  .text-bubble .copy strong,
  .text-bubble .copy i,
  .text-bubble .copy b {
    font-family: inherit;
    font-size: inherit;
    font-weight: inherit;
    font-style: inherit;
    color: inherit;
    opacity: 1;
    letter-spacing: inherit;
    line-height: inherit;
  }
  .text-bubble .copy .small {
    display: block;
    margin-top: 0.3em;
  }

  /* Bubble position variants */
  .pos-bottom-center  { left: 50%; bottom: 5%; transform: translateX(-50%); }
  .pos-bottom-left    { left: 4%;  bottom: 5%; }
  .pos-bottom-right   { right: 4%; bottom: 5%; }
  .pos-top-center     { left: 50%; top: 5%; transform: translateX(-50%); }
  .pos-top-left       { left: 4%;  top: 5%; }
  .pos-top-right      { right: 4%; top: 5%; }
  .pos-center         { left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .pos-middle-left    { left: 3%;  top: 50%; transform: translateY(-50%); }
  .pos-middle-right   { right: 3%; top: 50%; transform: translateY(-50%); }

  .cover-page {
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center center;
  }

  .page-num {
    position: absolute;
    bottom: 8px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 9px;
    letter-spacing: 0.2em;
    color: rgba(0,0,0,0.32);
    z-index: 3;
  }
  .page-num.left  { left: 14px; }
  .page-num.right { right: 14px; }

  .title-bar {
    position: fixed;
    top: 22px;
    left: 28px;
    z-index: 10;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .title-bar .title-byline {
    font-size: 10px;
    font-style: italic;
    opacity: 0.75;
    margin-top: 2px;
    letter-spacing: 0.06em;
  }

  .hint {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.08em;
    opacity: 0.7;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }
  .hint.fade { opacity: 0; }

  .nav-btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(60, 50, 30, 0.18);
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 18px;
    transition: opacity 0.3s ease, background 0.3s ease, transform 0.3s ease;
    opacity: 0;
  }
  .stage:hover .nav-btn { opacity: 0.85; }
  .nav-btn:hover { background: rgba(255,255,255,0.9); transform: translateY(-50%) scale(1.06); }
  .nav-prev { left: 18px; }
  .nav-next { right: 18px; }

  .loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    z-index: 100;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 13px;
    color: var(--muted);
    transition: opacity 0.6s ease;
  }
  .loading.gone { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div class="title-bar" style="display:none">
  <div class="title-main">Hi Everyone</div>
  <div class="title-byline">by Cady Sheng</div>
</div>

<div class="stage">
  <div class="book-wrap">
    <div id="book"></div>
  </div>

  <button class="nav-btn nav-prev" aria-label="previous" style="display:none">&lsaquo;</button>
  <button class="nav-btn nav-next" aria-label="next" style="display:none">&rsaquo;</button>
</div>

<div class="hint" id="hint">click the edge of the page to turn &#10022;</div>
<div class="loading" id="loading">opening the book&hellip;</div>

   PAGE DATA
   Text content reflects the full manuscript provided by the

   to widen or narrow the bubble's max-width.
   ========================================================= */

  { type: 'cover-front', image: 'images/0_frontcover_.jpg' },

  // Page 1
  {
    type: 'content',

  // Page 2

  // Page 3
  {
    type: 'content',
    image: 'images/3.jpg',
    text: `We put planets together<br/><em>&ldquo;Holding hands.&rdquo;</em>`,

  // Page 4

    type: 'content',

  // Page 6
  {
    type: 'content',
    image: 'images/6.jpg',

    pos: 'pos-bottom-right',
    bubbleClass: 'bubble-tiny'

  // Page 7
  {
    type: 'content',
    image: 'images/7.jpg',

    bubbleClass: 'bubble-wide'
  },
  // Page 8
  {
    type: 'content',

    text: `A vibration,<br/>a melody made by <em>nature all together.</em>`,
    pos: 'pos-bottom-right'

  // Page 9
  {
    type: 'content',
    image: 'images/9.jpg',
    text: `Everyone dances back to me,<br/>waving their bodies and branches and leaves.<br/><em>&ldquo;Now I will never unsee you,&rdquo;</em><br/>says the little girl.<br/>She hugs everyone.<br/><span class="small">! Bye Everyone ! &mdash; echoes in the woods</span>`,

/* =========================================================
   ORGANIC BUBBLE SVG
   The path is generated on a near-square viewBox with a near-circular
   base radius. Because the SVG is rendered with preserveAspectRatio="none"
   it stretches to fit the bubble's actual size, but starting from a round
   base means stretched results are still gentle ovals that fully contain
   the text (with the inset halo).
   ========================================================= */
function makeBubbleSVG(seed) {
  const rand = mulberry32(seed);
  const pts = 16;
  const cx = 200, cy = 200;
  const rx = 195, ry = 195;   // near-circle; gets stretched by SVG to bubble shape
  const coords = [];
  for (let i = 0; i < pts; i++) {
    const a = (i / pts) * Math.PI * 2;
    const wobble = 0.92 + rand() * 0.14;
    coords.push([
      cx + Math.cos(a) * rx * wobble,
      cy + Math.sin(a) * ry * wobble
    ]);
  }
  let d = `M ${coords[0][0].toFixed(1)} ${coords[0][1].toFixed(1)}`;
  for (let i = 0; i < pts; i++) {
    const p0 = coords[i];
    const p1 = coords[(i + 1) % pts];
    const mx = (p0[0] + p1[0]) / 2;
    const my = (p0[1] + p1[1]) / 2;
    d += ` Q ${p0[0].toFixed(1)} ${p0[1].toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)}`;
  }
  d += ' Z';
  return `<svg viewBox="0 0 400 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="${d}" fill="rgba(255,255,255,0.85)" />
  </svg>`;
}
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = a;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* =========================================================
   BUILD HTML PAGES
   ========================================================= */
const bookEl = document.getElementById('book');

function buildPage(p, idx) {
  const pageDiv = document.createElement('div');
  pageDiv.className = 'page';
  // Front / back covers are rigid (hard) pages so they flip like card stock
  // and PageFlip will display them as single-page spreads (showCover behaviour).
  pageDiv.dataset.density =
    (p.type === 'cover-front' || p.type === 'cover-back') ? 'hard' : 'soft';

  if (p.type === 'cover-front' || p.type === 'cover-back') {
    pageDiv.innerHTML = `<div class="cover-page" style="background-image:url('${p.image}')"></div>`;
  } else {
    const bubbleSVG = makeBubbleSVG(idx * 1000 + 7);
    const bubbleCls = `text-bubble ${p.pos}${p.bubbleClass ? ' ' + p.bubbleClass : ''}`;
    pageDiv.innerHTML = `
      <div class="page-image" style="background-image:url('${p.image}')">
        <div class="${bubbleCls}">
          ${bubbleSVG}
          <div class="copy">${p.text}</div>
        </div>
        <div class="page-num ${idx % 2 === 1 ? 'left' : 'right'}">${idx}</div>
      </div>
    `;
  }
  return pageDiv;
}

// Build pages in document order. The cover sits alone via PageFlip's
// built-in showCover behaviour, so no manual blank padding pages.
PAGES.forEach((p, i) => { bookEl.appendChild(buildPage(p, i)); });

/* =========================================================
   SIZE & INIT
   Each painting is 4776 x 1845 ≈ 2.59:1 (single page).
   ========================================================= */
function computeBookSize() {
  const margin = 60;
  const maxW = window.innerWidth - margin * 2;
  const maxH = window.innerHeight - margin * 2 - 60;
  const pageRatio   = 4776 / 1845;
  const spreadRatio = pageRatio * 2;
  let w = maxW;
  let h = w / spreadRatio;
  if (h > maxH) {
    h = maxH;
    w = h * spreadRatio;
  }
  return {
    pageW: Math.floor(w / 2),
    pageH: Math.floor(h)
  };
}

let pageFlip;

function initBook() {
  const { pageW, pageH } = computeBookSize();

  pageFlip = new St.PageFlip(bookEl, {
    width: pageW,
    height: pageH,
    size: 'fixed',
    minWidth: 200,
    maxWidth: 2000,
    minHeight: 150,
    maxHeight: 1600,
    showCover: true,
    flippingTime: 500,
    usePortrait: false,
    drawShadow: true,
    maxShadowOpacity: 0.35,
    mobileScrollSupport: false,
    swipeDistance: 30,
    showPageCorners: true,
    disableFlipByClick: false
  });

  pageFlip.loadFromHTML(document.querySelectorAll('#book .page'));

  setTimeout(() => {
    document.getElementById('loading').classList.add('gone');
  }, 400);
}

initBook();

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const { pageW, pageH } = computeBookSize();
    if (pageFlip && pageFlip.update) {
      pageFlip.update({ width: pageW, height: pageH });
    }
    if (typeof updateCoverCentering === 'function') updateCoverCentering();
  }, 200);
});

document.querySelector('.nav-prev').addEventListener('click', () => pageFlip.flipPrev());
document.querySelector('.nav-next').addEventListener('click', () => pageFlip.flipNext());

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft')  pageFlip.flipPrev();
  if (e.key === 'ArrowRight') pageFlip.flipNext();
});

let hintFaded = false;
function fadeHint() {
  if (hintFaded) return;
  hintFaded = true;
  document.getElementById('hint').classList.add('fade');
}

const bookWrapEl = document.querySelector('.book-wrap');
function updateCoverCentering() {
  if (!pageFlip) return;
  const idx = pageFlip.getCurrentPageIndex();
  const last = pageFlip.getPageCount() - 1;
  const rect = pageFlip.getBoundsRect();
  const half = rect ? rect.pageWidth / 2 : 0;
  let dx = 0;
  // Toggle solo-* classes so the CSS clip-path hides the empty half of the
  // double-page container while we slide the cover into the centre.
  bookWrapEl.classList.remove('solo-right', 'solo-left');
  if (idx === 0) {
    dx = -half;                                  // front cover on right → shift book left
    bookWrapEl.classList.add('solo-right');      // clip away the empty LEFT half
  } else if (idx === last) {
    dx = half;                                   // back cover on left  → shift book right
    bookWrapEl.classList.add('solo-left');       // clip away the empty RIGHT half
  }
  bookWrapEl.style.transform = `translateX(${dx}px)`;
  bookWrapEl.style.transition = 'transform 0.5s ease';
}

setTimeout(() => {
  try {
    pageFlip.on && pageFlip.on('flip', () => { fadeHint(); updateCoverCentering(); });
    pageFlip.on && pageFlip.on('init', updateCoverCentering);
  } catch(e) {}
  document.getElementById('book').addEventListener('click', fadeHint, { once: true });
  updateCoverCentering();
}, 500);
</script>
