<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Illustrations — Cady Sheng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body:    'Lora', Georgia, serif;
      --color-text:       #2a2a2a;
      --color-text-light: #888;
      --page-max-width:   960px;
      --page-padding:     40px;
      --gap:              12px;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body { background:#fff; color:var(--color-text); }

    .gallery { max-width:var(--page-max-width); margin:0 auto; padding:0 var(--page-padding); }
    .row  { display:flex; gap:var(--gap); align-items:flex-start; margin-bottom:var(--gap); }
    .col  { display:flex; flex-direction:column; gap:var(--gap); min-width:0; }
    .g    { display:block; line-height:0; cursor:pointer; min-width:0; }
    .g img { display:block; width:100%; height:auto; transition:opacity 0.3s ease; }
    .g { border-radius:8px; overflow:hidden; }
    .g img { border-radius:8px; }
    .g:hover img { opacity:0.88; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:var(--gap); }
    .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:var(--gap); }
    .sep { height:40px; }

    .page-header { max-width:var(--page-max-width); margin:40px auto 47px; padding:0 var(--page-padding); text-align:center; }
    .page-title  { text-align:center; }

    .page-nav { max-width:var(--page-max-width); margin:56px auto 52px; padding:0 var(--page-padding); display:flex; justify-content:space-between; align-items:center; }
    .page-nav__side { display:flex; flex-direction:column; align-items:flex-start; gap:6px; min-width:140px; }
    .page-nav__side--right { align-items:flex-end; }
    .page-nav__label { font-family:var(--font-body); font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:#a89f98; }
    .page-nav__name  { font-family:var(--font-display); font-size:15px; font-weight:400; color:var(--color-text-light); text-decoration:none; letter-spacing:0.3px; transition:color 0.25s; }
    .page-nav__name:hover { color:var(--color-text); }
    .page-nav__home  { font-family:var(--font-display); font-size:30px; font-weight:300; color:var(--color-text); letter-spacing:2px; text-decoration:none; transition:opacity 0.25s; }
    .page-nav__home:hover { opacity:0.6; }

    @media (max-width:600px) {
      :root { --page-padding:18px; }
      .row { flex-direction:column; }
      .row > .col, .row > .g { width:100% !important; flex:none !important; }
      .grid2 { grid-template-columns:1fr 1fr; }
      .grid3 { grid-template-columns:1fr 1fr; }
      .row > .col > .g[style*="width:105px"] { width:50% !important; }
      .row .row { flex-direction:column; }
      .row .row > .g,
      .row .row > .col { width:100% !important; flex:none !important; }
      .page-nav { flex-direction:column; gap:24px; align-items:center; }
      .page-nav__side, .page-nav__side--right { align-items:center; }
      /* Fix object-fit:cover images — show full image */
      .row[style*="stretch"] { height:auto !important; }
      .row[style*="stretch"] > .g { height:auto !important; flex:none !important; width:100% !important; }
      .row[style*="stretch"] > .g img { height:auto !important; object-fit:unset !important; }

    /* ── Side nav styles now live in nav.js ── */
      /* Title image: invert (dark→white bg), then colorize to #5A4B42 */
      .page-header{background:#fff;}
      .page-header img{
        filter:invert(1) brightness(0) sepia(1) saturate(0.55) hue-rotate(338deg) brightness(0.44);
        mix-blend-mode:multiply;
      }

    @media(max-width:767px) and (pointer:coarse){
      /* Override 600px page-nav column layout → horizontal row on mobile */
      .page-nav{
        flex-direction:row !important;
        align-items:center !important;
        gap:0 !important;
        width:100%;
        box-sizing:border-box;
        padding:0 16px;
        margin:24px 0 20px;
      }
      .page-nav__side,
      .page-nav__side--right{
        flex:0 0 40%;
        width:40%;
        min-width:0;
        display:flex;
        flex-direction:column;
        gap:2px;
        box-sizing:border-box;
      }
      .page-nav__side{ align-items:flex-start !important; padding-right:8px; }
      .page-nav__side--right{ align-items:flex-end !important; padding-left:8px; }
      .page-nav__home{
        flex:0 0 20%;
        width:20%;
        text-align:center;
        font-size:16px;
        padding:0;
        box-sizing:border-box;
      }
      .page-nav__label{ display:none; }
      .page-nav__name{
        font-size:11px;
        line-height:1.3;
        word-break:break-word;
        overflow-wrap:break-word;
        display:block;
        max-width:100%;
      }

      .g, .g img { border-radius:3px !important; overflow:hidden; }
      /* ── Mobile performance: reduce CLS and rendering cost ── */

      /* Skip rendering rows until near viewport */
      .gallery .r,
      .gallery .row {
        content-visibility: auto;
        contain-intrinsic-size: 0 300px;
      }

      /* Isolate paint/layout per row — cheaper reflows */
      .gallery .r,
      .gallery .row {
        contain: layout style;
      }

      /* Images: prevent reflow, GPU-friendly rendering */
      .gallery img {
        will-change: auto;
        transform: translateZ(0);
        backface-visibility: hidden;
      }

      /* Reserve minimum height before images load — but NOT inside grid3 */
      .gallery .g {
        min-height: 120px;
      }
      .gallery .grid3 .g {
        min-height: 0;
      }

      /* Disable hover transitions on mobile (no hover anyway) */
      .gallery img,
      .g img {
        transition: none !important;
      }
      /* Keep 9-grid as 3×3 on mobile */
      .grid3 {
        grid-template-columns: 1fr 1fr 1fr !important;
        display: grid !important;
      }

      /* Fix: remove min-height inside grid cells — causes large gaps */
      .grid3 .g { min-height: 0 !important; }

      /* Block B mobile layout:
         I17/I19/I20/I21 → 2×2 grid
         I18, I22        → single full-width row                    */
      .il-grid2x2 {
        display:grid !important;
        grid-template-columns:1fr 1fr !important;
        gap:8px !important;
        margin-bottom:8px !important;
      }
      .il-grid2x2 .g { width:100% !important; }
      .il-grid2x2 .g img { width:100% !important; height:auto !important; display:block !important; object-fit:unset !important; }

      .il-single {
        display:block !important;
        width:100% !important;
        margin-bottom:8px !important;
      }
      .il-single img { width:100% !important; height:auto !important; display:block !important; }
    }
  </style>
</head>
<body>

  <div style="text-align:center;padding:40px 0 20px">
    <img loading="eager" fetchpriority="high" decoding="async" src="illustrations/illustrations-title.png" alt="Illustrations" style="max-width:397px; width:51%; height:auto; display:inline-block">
  </div>

  <div class="gallery">

    <!--
    BLOCK A — confirmed from pixel analysis of design mockup:
    LEFT  (38%): I1 · I3 · I4 · I8 · I15
    RIGHT (62%): I2 (large)
                 3×3 grid: I5 I6 I7 / I9 I10 I11 / I12 I13 I14
                 I20 (wide swirl dancer, full right-col width)
    -->
    <div class="row">

      <!-- LEFT: I1 · I3 · I4 · I8 · I15 -->
      <div class="col" style="flex:0 0 38%">
        <div class="g" data-title="Portal">
          <img decoding="async" src="illustrations/I1 (Portal).jpg" alt="Portal" loading="lazy" decoding="async">
        </div>
        <div class="g" data-title="Maternal Bond">
          <img decoding="async" src="illustrations/I3 (Maternal Bond).jpg" alt="Maternal Bond" loading="lazy">
        </div>
        <div class="g" data-title="From the Mountains: Don't Be Afraid I">
          <img decoding="async" src="illustrations/I4.jpg" alt="From the Mountains: Don't Be Afraid I" loading="lazy">
        </div>
        <div class="g" data-title="From the Mountains: Don't Be Afraid II">
          <img decoding="async" src="illustrations/I8.jpg" alt="From the Mountains: Don't Be Afraid II" loading="lazy">
        </div>
        <div class="g" data-title="Notes and Trees">
          <img decoding="async" src="illustrations/I15 (Notes and Trees).jpg" alt="Notes and Trees" loading="lazy">
        </div>
      </div>

      <!-- RIGHT: I2 · 3×3 grid · I20 wide -->
      <div class="col" style="flex:1">
        <div class="g" data-title="The Princess and the Pea">
          <img decoding="async" src="illustrations/I2 (The Princess and the Pea).jpg" alt="The Princess and the Pea" loading="lazy">
        </div>
        <!-- 3×3 grid: row1 I5 I6 I7 -->
        <div class="grid3">
          <div class="g" data-title="Dialogue Between the Gods">
            <img decoding="async" src="illustrations/I5 (Dialogue Between the Gods).jpg" alt="Dialogue Between the Gods" loading="lazy">
          </div>
          <div class="g" data-title="Bow">
            <img decoding="async" src="illustrations/I6 (Bow).jpg" alt="Bow" loading="lazy">
          </div>
          <div class="g" data-title="Queen">
            <img decoding="async" src="illustrations/I7 (Queen).jpg" alt="Queen" loading="lazy">
          </div>
        </div>
        <!-- row2 I9 I10 I11 -->
        <div class="grid3">
          <div class="g" data-title="Giant">
            <img decoding="async" src="illustrations/I9 (Giant).jpg" alt="Giant" loading="lazy">
          </div>
          <div class="g" data-title="Lamb">
            <img decoding="async" src="illustrations/I10 (Lamb).jpg" alt="Lamb" loading="lazy">
          </div>
          <div class="g" data-title="Redfish and Fox">
            <img decoding="async" src="illustrations/I11 (Redfish and Fox).jpg" alt="Redfish and Fox" loading="lazy">
          </div>
        </div>
        <!-- row3 I12 I13 I14 -->
        <div class="grid3">
          <div class="g" data-title="Witch">
            <img decoding="async" src="illustrations/I12 (Witch).jpg" alt="Witch" loading="lazy">
          </div>
          <div class="g" data-title="Ghosts">
            <img decoding="async" src="illustrations/I13 (Ghosts).jpg" alt="Ghosts" loading="lazy">
          </div>
          <div class="g" data-title="Pond">
            <img decoding="async" src="illustrations/I14 (Pond).jpg" alt="Pond" loading="lazy">
          </div>
        </div>
        <!-- Wide image below grid: I16 swirl dancer -->
        <div class="g" data-title="From the Mountains: The Dance Begins I">
          <img decoding="async" src="illustrations/I16 (From the Mountains_ The Dance Begins I).jpg" alt="From the Mountains: The Dance Begins I" loading="lazy">
        </div>
      </div>

    </div><!-- /BLOCK A -->

    <div class="sep"></div>

    <!--
    BLOCK B — I17–I22 in two rows of 3
    Row 1: I17 · I18 · I19
    Row 2: I20 · I21 · I22
    -->
    <div class="row" data-il-row="b1">
      <div class="g" data-il="I17" data-title="From the Mountains: The Dance Begins II" style="flex:1">
        <img decoding="async" src="illustrations/I17 (From the Mountains_ The Dance Begins II).jpg" alt="From the Mountains: The Dance Begins II" loading="lazy">
      </div>
      <div class="g" data-il="I18" data-title="From the Mountains: The Singing Duel I" style="flex:1">
        <img decoding="async" src="illustrations/I18 (From the Mountains_ The Singing Duel I).jpg" alt="From the Mountains: The Singing Duel I" loading="lazy">
      </div>
      <div class="g" data-il="I19" data-title="From the Mountains: Praise of Genghis Khan" style="flex:1">
        <img decoding="async" src="illustrations/I19 (From the Mountains_ Praise of Genghis Khan).jpg" alt="From the Mountains: Praise of Genghis Khan" loading="lazy">
      </div>
    </div>

    <div class="row" data-il-row="b2">
      <div class="g" data-il="I20" data-title="From the Mountains: Lobsang Dongzhi" style="flex:1">
        <img decoding="async" src="illustrations/I20 (From the Mountains_ Lobsang Dongzhi).jpg" alt="From the Mountains: Lobsang Dongzhi" loading="lazy">
      </div>
      <div class="g" data-il="I21" data-title="From the Mountains: The Singing Duel II" style="flex:1">
        <img decoding="async" src="illustrations/I21 (From the Mountains_ The Singing Duel II).jpg" alt="From the Mountains: The Singing Duel II" loading="lazy">
      </div>
      <div class="g" data-il="I22" data-title="From the Mountains: Amala" style="flex:1">
        <img decoding="async" src="illustrations/I22 (From the Mountains_ Amala).jpg" alt="From the Mountains: Amala" loading="lazy">
      </div>
    </div>

    <div class="sep"></div>

    <!--
    BLOCK C — rabbit / play series
    LEFT col (wider): I23 / I25 / I27 / I29  stacked
    RIGHT col:        I24 / I26 / I28         stacked
    Note: I27 filename on disk is "I27 (Untitled).jpg_" — needs rename.
    We try both extensions.
    -->
    <div class="row">
      <!-- LEFT: I23 / I25 / I27 / I29 -->
      <div class="col" style="flex:1.3">
        <div class="g" data-title="Rabbits">
          <img decoding="async" src="illustrations/I23 (Rabbits).jpg" alt="Rabbits" loading="lazy">
        </div>
        <div class="g" data-title="Rabbits 1">
          <img decoding="async" src="illustrations/I25 (Rabbits 1).jpg" alt="Rabbits 1" loading="lazy">
        </div>
        <div class="g" data-title="Untitled" id="i27-wrap">
          <img decoding="async" src="illustrations/I27 (Untitled).jpg" alt="Untitled" loading="lazy"
               onerror="this.src='illustrations/I27 (Untitled).jpg_'">
        </div>
        <div class="g" data-title="Rabbit Running Free">
          <img decoding="async" src="illustrations/I29 (Rabbit Running Free).jpg" alt="Rabbit Running Free" loading="lazy">
        </div>
      </div>
      <!-- RIGHT: I24 / I26 / I28 -->
      <div class="col" style="flex:1; justify-content:space-between; align-self:stretch">
        <div class="g" data-title="Play">
          <img decoding="async" src="illustrations/I24 (Play).jpg" alt="Play" loading="lazy">
        </div>
        <div class="g" data-title="Play II">
          <img decoding="async" src="illustrations/I26 (Play).jpg" alt="Play II" loading="lazy">
        </div>
        <div class="g" data-title="Untitled II" style="width:105px; align-self:flex-start">
          <img decoding="async" src="illustrations/I28 (Untitled).jpg" alt="Untitled II" loading="lazy">
        </div>
      </div>
    </div>

    <div class="sep"></div>



    <div class="row" style="align-items:stretch">
      <div class="g" data-title="Argument" style="flex:1.3; display:flex">
        <img decoding="async" src="illustrations/I35 (Argument).jpg" alt="Argument" loading="lazy" style="width:100%;height:auto;display:block">
      </div>
      <div class="g" data-title="The Curious Incident of the Dog in the Night-Time" style="flex:1">
        <img decoding="async" src="illustrations/I36 (The Curious Incident of the Dog in the Night-Time).jpg" alt="The Curious Incident of the Dog in the Night-Time" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block">
      </div>
    </div>

  </div><!-- /gallery -->

  <nav class="page-nav">
    <div class="page-nav__side">
      <span class="page-nav__label">Previous</span>
      <a href="apparel.html" class="page-nav__name">&lsaquo;&ensp;Apparel</a>
    </div>
    <a href="index.html" class="page-nav__home">Home</a>
    <div class="page-nav__side page-nav__side--right">
      <span class="page-nav__label">Next</span>
      <a href="stage-art-production.html" class="page-nav__name">Stage Art&ensp;&rsaquo;</a>
    </div>
  </nav>

  <div id="footer"></div>
  <script src="nav.js"></script>
  <script src="lightbox.js"></script>
  <script src="footer.js"></script>
  <script>
  (function(){
    if(window.innerWidth > 767 || !(navigator.maxTouchPoints > 0 || matchMedia('(pointer:coarse)').matches)) return;
    if(document.querySelector('.il-mobile-built')) return;

    var gallery = document.querySelector('.gallery');
    if(!gallery) return;

    function get(id){ return document.querySelector('[data-il="'+id+'"]'); }

    var I17=get('I17'), I18=get('I18'), I19=get('I19');
    var I20=get('I20'), I21=get('I21'), I22=get('I22');
    if(!I17||!I18||!I19||!I20||!I21||!I22) return;

    var rowB1 = document.querySelector('[data-il-row="b1"]');
    var rowB2 = document.querySelector('[data-il-row="b2"]');
    if(!rowB1||!rowB2) return;

    /* Build: I18 single → 2×2 grid(I17,I19,I20,I21) → I22 single */
    var single18 = document.createElement('div');
    single18.className = 'il-single';
    single18.appendChild(I18);

    var grid2x2 = document.createElement('div');
    grid2x2.className = 'il-grid2x2';
    [I17, I19, I20, I21].forEach(function(el){ grid2x2.appendChild(el); });

    var single22 = document.createElement('div');
    single22.className = 'il-single';
    single22.appendChild(I22);

    /* Insert before rowB1, then hide original rows */
    rowB1.parentNode.insertBefore(single18, rowB1);
    rowB1.parentNode.insertBefore(grid2x2, rowB1);
    rowB1.parentNode.insertBefore(single22, rowB1);
    rowB1.style.display = 'none';
    rowB2.style.display = 'none';

    gallery.classList.add('il-mobile-built');
  })();
  </script>
</body>
</html>
