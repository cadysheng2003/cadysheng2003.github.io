      /* ── Mobile performance: reduce CLS and rendering cost ── */

      /* Skip rendering rows until near viewport */
      .gallery .r,
      .gallery .row {
        content-visibility: auto;
        contain-intrinsic-size: 0 300px;
      }

      /* Isolate paint/layout per row — cheaper reflows */
      .gallery .r,
      .gallery .row,
      .gallery .g {
        contain: layout style;
      }

      /* Images: prevent reflow, GPU-friendly rendering */
      .gallery img {
        will-change: auto;
        transform: translateZ(0);
        backface-visibility: hidden;
      }

      /* Reserve minimum height before images load */
      .gallery .g {
        min-height: 120px;
      }

      /* Disable hover transitions on mobile (no hover anyway) */
      .gallery img,
      .g img {
        transition: none !important;

      .gallery .c { contain:layout style; }
      .gallery img { will-change:auto; transform:translateZ(0); backface-visibility:hidden; }

  <script src="footer.js" defer></script>

  <script>
  (function(){
    function buildApparelMobile(){
      if(window.innerWidth > 767 || !(navigator.maxTouchPoints > 0 || matchMedia('(pointer:coarse)').matches)) return;
      if(document.querySelector('.apparel-mobile-built')) return;

      var gallery = document.querySelector('.gallery');
      if(!gallery) return;

      var row1 = gallery.querySelector('.r');
      if(!row1) return;

      /* Collect all .g tiles from row1
         Desktop column order: col-left(A1,A5), col-mid(A2,A4,A8), col-right(A3,A6,A7)
         allTiles indices:      0=A1,1=A5,  2=A2,3=A4,4=A8,  5=A3,6=A6,7=A7          */
      var allTiles = Array.from(row1.querySelectorAll('.g'));

      /* Row A: A1(0), A2(2), A3(5) — 3-col single row */
      var rowA = document.createElement('div');
      rowA.className = 'ap-row3';
      [0,2,5].forEach(function(i){ if(allTiles[i]) rowA.appendChild(allTiles[i]); });

      /* Grid B: A4(3), A5(1), A6(6), A7(7), A8(4) — 2-col columns */
      var gridB = document.createElement('div');
      gridB.className = 'ap-grid2';
      [3,1,6,7,4].forEach(function(i){ if(allTiles[i]) gridB.appendChild(allTiles[i]); });

      row1.parentNode.insertBefore(rowA, row1);
      row1.parentNode.insertBefore(gridB, row1);
      row1.style.display = 'none';

      /* Tag Moon Series rows for reliable flex-ratio targeting */
      var moonRows = Array.from(gallery.querySelectorAll('.r[style*="height:300px"]'));
      if(moonRows[0]) moonRows[0].classList.add('ap-moon-row1');
      if(moonRows[1]) moonRows[1].classList.add('ap-moon-row2');

      gallery.classList.add('apparel-mobile-built');
    if (window.csRefreshLightbox) window.csRefreshLightbox();
    }

    buildApparelMobile();

    /* Force title image size on mobile */
    (function(){
      if(window.innerWidth > 767 || !(navigator.maxTouchPoints > 0 || matchMedia('(pointer:coarse)').matches)) return;
      var img = document.getElementById('ap-title-img');
      if(img){ img.style.setProperty('width','35%','important'); img.style.setProperty('max-width','180px','important'); }
    })();
  })();
  </script>
</body>
</html>
