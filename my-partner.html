<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#fff9f7">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Partner — Cady Sheng</title>
  <meta property="og:site_name" content="Cady Sheng">
  <meta property="og:type" content="website">
  <meta property="og:title" content="My Partner — Cady Sheng">
    <link rel="preload" as="image" href="my-partner/my-partner-title.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Lora:ital,wght@0,400;1,400&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet"></noscript>
  <style>
    :root {
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body:    'Lora', Georgia, serif;
      --color-text:       #2a2a2a;
      --color-text-light: #888;
      --page-max-width:   960px;
      --page-padding:     40px;
      --gap:              8px;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body { background:#fff; color:var(--color-text); }

    .gallery { max-width:var(--page-max-width); margin:0 auto; padding:0 var(--page-padding); }
    .r  { display:flex; gap:var(--gap); margin-bottom:var(--gap); align-items:flex-start; }
    .c  { display:flex; flex-direction:column; gap:var(--gap); min-width:0; }
    .g  { display:block; line-height:0; cursor:pointer; min-width:0; }
    .g img   { display:block; width:100%; height:auto; transition:opacity 0.3s ease; }
    .g { border-radius:8px; overflow:hidden; }
    .g img { border-radius:8px; }
    .g video { display:block; width:100%; height:auto; }
    .g:hover img { opacity:0.88; }
    .g2 { display:grid; grid-template-columns:1fr 1fr; gap:var(--gap); }
    .g3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:var(--gap); }
    .sep    { height:40px; }
    .sep-sm { height:20px; }

    .page-header { max-width:var(--page-max-width); margin:40px auto 32px; padding:0 var(--page-padding); text-align:center; }
    .page-title  { font-family:var(--font-display); font-size:32px; font-weight:400; letter-spacing:0.5px; }

    .intro-text { max-width:var(--page-max-width); margin:0 auto 36px; padding:0 var(--page-padding); }
    .intro-text p { font-family:var(--font-body); font-size:14px; line-height:1.8; color:var(--color-text-light); margin-bottom:10px; padding-left:24px; }

    .page-nav { max-width:var(--page-max-width); margin:56px auto 52px; padding:0 var(--page-padding); display:flex; justify-content:space-between; align-items:center; }
    .page-nav__side { display:flex; flex-direction:column; align-items:flex-start; gap:6px; min-width:140px; }
    .page-nav__side--right { align-items:flex-end; }
    .page-nav__label { font-family:var(--font-body); font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:#a89f98; }
    .page-nav__name  { font-family:var(--font-display); font-size:15px; font-weight:400; color:var(--color-text-light); text-decoration:none; letter-spacing:0.3px; transition:color 0.25s; }
    .page-nav__name:hover { color:var(--color-text); }
    .page-nav__home  { font-family:var(--font-display); font-size:30px; font-weight:300; color:var(--color-text); letter-spacing:2px; text-decoration:none; transition:opacity 0.25s; }
    .page-nav__home:hover { opacity:0.6; }

    @media (max-width:600px) {
      :root { --page-padding:18px; }
      /* Stack rows and kill all fixed heights */
      .r { flex-direction:column !important; gap:12px !important; height:auto !important; }
      .r > .g { width:100% !important; flex:none !important; height:auto !important; overflow:visible !important; }
      /* Images: natural proportions, no cropping */
      .r > .g img { width:100% !important; height:auto !important; object-fit:unset !important; }
      .g3 { grid-template-columns:1fr 1fr; }
      .page-nav { flex-direction:column; gap:24px; align-items:center; }
      .page-nav__side, .page-nav__side--right { align-items:center; }
    }

    @media(max-width:767px) and (pointer:coarse){
      /* Override 600px page-nav column layout → horizontal row on mobile */
      .page-nav{
        flex-direction:row !important;
        align-items:center !important;
        gap:0 !important;
        width:100%;
        box-sizing:border-box;
        padding:0 16px;
        margin:24px 0 20px;
      }
      .page-nav__side,
      .page-nav__side--right{
        flex:0 0 40%;
        width:40%;
        min-width:0;
        display:flex;
        flex-direction:column;
        gap:2px;
        box-sizing:border-box;
      }
      .page-nav__side{ align-items:flex-start !important; padding-right:8px; }
      .page-nav__side--right{ align-items:flex-end !important; padding-left:8px; }
      .page-nav__home{
        flex:0 0 20%;
        width:20%;
        text-align:center;
        font-size:16px;
        padding:0;
        box-sizing:border-box;
      }
      .page-nav__label{ display:none; }
      .page-nav__name{
        font-size:11px;
        line-height:1.3;
        word-break:break-word;
        overflow-wrap:break-word;
        display:block;
        max-width:100%;
      }

      .g, .g img { border-radius:3px !important; overflow:hidden; }
      body{padding-left:0 !important;}

      /* Page header / title image */
      .page-header{margin:24px auto 20px;padding:0 20px;}
      .page-header img{width:60% !important;max-width:240px !important;height:auto !important;}

      /* Gallery rows → single column */
      .gallery{padding:0 16px;}
      .r,.row{flex-direction:column !important;height:auto !important;gap:10px !important;}
      .r > .g, .r > .c, .r > div,
      .row > .g, .row > .col, .row > div{
        width:100% !important;flex:none !important;
        height:auto !important;overflow:visible !important;
      }
      .r > .g img, .r > .g video,
      .row > .g img, .row > .g video{
        height:auto !important;object-fit:unset !important;max-height:none !important;
        width:100% !important;
      }
      .c,.col{width:100% !important;flex:none !important;}
      .g2{grid-template-columns:1fr 1fr;}
      .g3{grid-template-columns:1fr 1fr;}
      .gd3col,.tm3col{flex-direction:column !important;}
      .gd-l,.gd-m,.gd-r,.tm-l,.tm-m,.tm-r{flex:none !important;width:100% !important;}
      .sep{height:24px;}
      .sep-sm{height:12px;}
      .cb-row{flex-direction:column !important;gap:12px !important;padding:0 16px !important;}
      .cb-img,.cb-img--small{flex:none !important;width:100% !important;}
      .cb-text{padding-top:0 !important;font-size:15px !important;}
      .r[style*="height"]{height:auto !important;}
      .r[style*="height"] > .g{height:auto !important;flex:none !important;width:100% !important;overflow:visible !important;}
      .r[style*="height"] > .g img{height:auto !important;object-fit:contain !important;}
      .r[style*="height"] > div video{height:auto !important;width:100% !important;}
      div[style*="display:flex"][style*="gap:12px"]{flex-direction:column !important;}
      div[style*="padding:40px"] img[style*="width"],
      div[style*="text-align:center"] img[style*="width"]{
        width:55% !important;max-width:220px !important;height:auto !important;
      }
      .g::after,.tile::after,.hero-tile::after{display:none !important;}
      .page-nav{
        width:100%;
        box-sizing:border-box;
        padding:0 16px;
        margin:24px 0 20px;
        display:flex;
        flex-direction:row;
        align-items:center;
        gap:0;
      }
      /* Each side takes exactly 40% width */
      .page-nav__side,
      .page-nav__side--right{
        flex:0 0 40%;
        width:40%;
        min-width:0;
        display:flex;
        flex-direction:column;
        gap:2px;
        box-sizing:border-box;
      }
      .page-nav__side{
        align-items:flex-start;
        padding-right:8px;
      }
      .page-nav__side--right{
        align-items:flex-end;
        padding-left:8px;
      }
      /* Home takes the middle 20% */
      .page-nav__home{
        flex:0 0 20%;
        width:20%;
        text-align:center;
        font-size:16px;
        padding:0;
        box-sizing:border-box;
      }
      .page-nav__label{ display:none; }
      .page-nav__name{
        font-size:12px;
        line-height:1.4;
        word-break:break-word;
        overflow-wrap:break-word;
        hyphens:auto;
        display:block;
        max-width:100%;
      }
footer,#footer{padding-bottom:env(safe-area-inset-bottom,20px);}
    }

  </style>
  <style>
    @media(max-width:767px) and (pointer:coarse){
      .gallery .r, .gallery .row { content-visibility:auto; contain-intrinsic-size:0 400px; }
      .gallery .g { contain:layout style; }
      .gallery img { will-change:auto; transform:translateZ(0); backface-visibility:hidden; transition:none !important; }
    }
  </style>
</head>
<body>

  <div style="text-align:center; padding:40px 0 12px">
    <img loading="eager" fetchpriority="high" decoding="async" src="my-partner/my-partner-title.png" alt="My Partner" style="width:65%; max-width:320px; height:auto; display:inline-block">
  </div>

  <div class="gallery">
    <!-- Row 1: MP1 + MP4(My Partner 2), equal width, cover fill, ~350px tall -->
    <div class="r" style="height:350px;gap:12px">
      <div class="g" data-title="My Partner 1" style="flex:1;height:100%;overflow:hidden">
        <img decoding="async" src="my-partner/MP1 (My Partner 1).jpg" alt="My Partner 1" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block">
      </div>
      <div class="g" data-title="My Partner 4" style="flex:1;height:100%;overflow:hidden">
        <img decoding="async" src="my-partner/MP4 (My Partner 2).jpg" alt="My Partner 4" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block">
      </div>
    </div>
    <!-- Row 2: MP3 + MP2(My Partner 4) + MP5, equal width, cover fill, ~270px tall -->
    <div class="r" style="height:270px;gap:12px">
      <div class="g" data-title="My Partner 3" style="flex:1;height:100%;overflow:hidden">
        <img decoding="async" src="my-partner/MP3 (My Partner 3).jpg" alt="My Partner 3" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block">
      </div>
      <div class="g" data-title="My Partner 2" style="flex:1;height:100%;overflow:hidden">
        <img decoding="async" src="my-partner/MP2 (My Partner 4).jpg" alt="My Partner 2" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block">
      </div>
      <div class="g" data-title="My Partner 5" style="flex:1;height:100%;overflow:hidden">
        <img decoding="async" src="my-partner/MP5 (My Partner 5).jpg" alt="My Partner 5" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block">
      </div>
    </div>
  </div>

  <nav class="page-nav">
    <div class="page-nav__side">
      <span class="page-nav__label">Previous</span>
      <a href="stage-art-production.html" class="page-nav__name">&lsaquo;&ensp;Stage Art</a>
    </div>
    <a href="index.html" class="page-nav__home">Home</a>
    <div class="page-nav__side page-nav__side--right">
      <span class="page-nav__label">Next</span>
      <a href="childrens-book.html" class="page-nav__name">Children&ensp;&rsaquo;</a>
    </div>
  </nav>

  <div id="footer"></div>
  <script src="nav.js" defer></script>
  <script src="lightbox.js"></script>
  <script src="footer.js" defer></script>
</body>
</html>
