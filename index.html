<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cady Sheng — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Lora:ital,wght@0,400;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --font-display:'Cormorant Garamond',Georgia,serif; --font-body:'Lora',Georgia,serif; --font-ui:'Jost',sans-serif; --color-text:#4f463f; --color-text-light:#8a817a; --page-max-width:960px; --page-padding:40px; }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    html{-webkit-font-smoothing:antialiased;}
    body{background:#fff;color:var(--color-text);}
    .site-header{max-width:var(--page-max-width);margin:0 auto;padding:35px var(--page-padding) 0;}
    .logo-image{display:block;width:min(744px,calc(100% - var(--page-padding)*2));height:auto;margin:0 auto;}
    .tagline{font-family:var(--font-body);font-size:13.5px;font-style:italic;text-align:right;color:var(--color-text-light);margin-top:7px;letter-spacing:0.3px;}
    .collage{max-width:var(--page-max-width);margin:14px auto 0;padding:0 var(--page-padding);}
    .hero-tile{display:block;overflow:hidden;text-decoration:none;color:inherit;margin-bottom:18px;position:relative;border-radius:17px;}
    .hero-tile img{display:block;width:100%;height:auto;transition:transform 0.3s ease;}
    .hero-tile:hover img{opacity:1;transform:scale(1.04);}
    .hero-tile .tile__label{
      position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      background:rgba(0,0,0,0);color:#fff;
      font-family:var(--font-ui);font-size:18px;font-weight:500;letter-spacing:3px;text-align:center;text-transform:uppercase;
      opacity:0;transition:background 0.25s ease,opacity 0.25s ease;
      padding:16px;
    }
    .hero-tile:hover .tile__label{background:rgba(0,0,0,0.25);opacity:1;}

    .collage-columns{display:flex;gap:16px;align-items:flex-start;}
    .col-left{flex:0 0 36%;display:flex;flex-direction:column;gap:18px;}
    .col-middle{flex:0 0 32.5%;display:flex;flex-direction:column;gap:18px;}
    .col-right{flex:1;display:flex;flex-direction:column;gap:18px;}
    .tile{display:block;overflow:hidden;text-decoration:none;color:inherit;position:relative;border-radius:17px;}
    .tile img{display:block;width:100%;height:auto;transition:transform 0.3s ease;}
    .tile:hover img{opacity:1;transform:scale(1.04);}
    .tile__label{
      position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      background:rgba(0,0,0,0);color:#fff;
      font-family:var(--font-ui);font-size:15px;font-weight:500;letter-spacing:3px;text-align:center;text-transform:uppercase;
      opacity:0;transition:background 0.25s ease,opacity 0.25s ease;
      padding:12px;
    }
    .tile:hover .tile__label{background:rgba(0,0,0,0.25);opacity:1;}

    .connect-section{max-width:var(--page-max-width);margin:60px auto 0;padding:0 var(--page-padding);text-align:right;}
    .connect-btn{display:inline-block;font-family:var(--font-display);font-size:17px;font-weight:400;color:var(--color-text);text-decoration:none;letter-spacing:0.5px;background:#f7f5f3;padding:14px 32px;}
    .site-footer{max-width:var(--page-max-width);margin:52px auto 0;padding:32px var(--page-padding) 48px;border-top:1px solid #e8e8e8;display:flex;justify-content:space-between;align-items:flex-start;gap:40px;}
    .footer-contact p,.footer-copyright p{font-family:var(--font-body);font-size:13px;line-height:2;color:var(--color-text-light);}
    .footer-contact a{color:var(--color-text-light);text-decoration:none;border-bottom:1px solid #ddd;}
    .footer-contact a:hover{color:var(--color-text);}
    .footer-copyright{text-align:right;}
    .fade-in{opacity:0;transform:translateY(12px);animation:fadeUp 0.7s ease forwards;}
    .delay-1{animation-delay:0.15s;}.delay-2{animation-delay:0.3s;}.delay-3{animation-delay:0.45s;}
    @keyframes fadeUp{to{opacity:1;transform:translateY(0);}}
    
    /* Desktop: match Apparel height to Stage Art & Production */
    a[href="apparel.html"].tile,
    a[href="stage-art-production.html"].tile{aspect-ratio:16/9;}
    a[href="apparel.html"].tile img,
    a[href="stage-art-production.html"].tile img{height:100%;object-fit:cover;object-position:center;}
          /* Dual-language tile labels — global, works on all devices */
      .t-zh { display:none; }
      html.lang-zh .t-en { display:none; }
      html.lang-zh .t-zh { display:inline; }

      @media(max-width:767px) and (pointer:coarse){

      body{ padding-left:0 !important; padding-bottom:env(safe-area-inset-bottom,20px); }

      /* Header */
      .site-header{ padding:4px 16px 0; text-align:center; }
      .logo-image{ width:min(453px,96vw) !important; min-width:0 !important; display:block; margin:0 auto; transform:translateX(-6px); }
      .tagline{
        font-family:'Cormorant Garamond',Georgia,serif;
        font-size:15px;
        font-style:italic;
        font-weight:300;
        letter-spacing:0.04em;
        color:#8A8278;
        opacity:0.85;
        text-align:center;
        text-transform:none;
        margin-top:2px;   /* tighter to logo */
      }

      /* Collage */
      .collage{ padding:0 16px; margin-top:9px; }

      /* Hero */
      .hero-tile{ margin-bottom:16px; position:relative; display:block; overflow:hidden; border-radius:2px; }
      .hero-tile img{ width:100%; height:auto; object-fit:unset; display:block; transition:none; }
      .hero-tile .tile__label{
        opacity:1 !important; transition:none !important;
        background:linear-gradient(to top, rgba(0,0,0,0.48) 0%, rgba(0,0,0,0) 58%) !important;
        align-items:flex-end !important; justify-content:flex-start !important;
        text-align:left !important;
        padding:18px 14px; font-size:15px; font-weight:500;
        letter-spacing:2px; text-transform:uppercase;
      }
      .hero-tile::after{ display:none; }

      /* ── Mobile 2-col: collage-columns becomes a flex row wrapper ──
         JS (mobile-grid.js inline) renders two independent column divs.
         Original col-left/middle/right are hidden; JS columns take over.
      ── */
      .collage-columns{
        display:flex !important;
        flex-direction:row !important;
        gap:10px !important;
        align-items:flex-start !important;
        margin-top:0;
      }
      /* Hide original col wrappers — JS will rebuild layout */
      .col-left, .col-middle, .col-right{ display:none !important; }

      /* JS-created independent columns */
      .mob-col{
        flex:1;
        display:flex;
        flex-direction:column;
        gap:16px;
        min-width:0;
      }
      .mob-col .tile{
        display:block; position:relative; overflow:hidden; width:100%;
      }

      /* ── Base tile images ── */
      .tile{ position:relative; overflow:hidden; }
      .tile::after{ display:none !important; }
      .tile img{
        width:100%; height:auto; min-height:30vw;
        object-fit:cover; object-position:center;
        display:block; transition:none; background:transparent;
      }

      /* Per-image position tuning */
      a[href="my-partner.html"] img{ object-position:center top; min-height:38vw; }

      a[href="flow-and-spirituality.html"] img{ object-position:center center; min-height:43vw; max-height:43vw; }
      a[href="graphic-design.html"] img{ object-position:center top; min-height:34vw; }
      a[href="apparel.html"] img{ object-position:center top; min-height:34vw; }
      a[href="childrens-book.html"] img{ object-position:center top; min-height:36vw; }
      a[href="jewelry.html"] img{ object-fit:contain; background:transparent; min-height:28vw; }

      /* ── Labels: show immediately, no JS dependency ── */
      .tile .tile__label{
        opacity:1 !important; transition:none !important;
        background:linear-gradient(to top, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0) 60%) !important;
        align-items:flex-end !important; justify-content:flex-start !important;
        text-align:left !important;
        padding:14px 12px; font-size:13px; font-weight:500;
        letter-spacing:1.8px; text-transform:uppercase; color:#fff;
      }
      .tile--small .tile__label{ font-size:12px; padding:12px 10px; }

      /* ── Rounded corners on all mobile category tiles ── */
      .hero-tile,
      .hero-tile img,
      .hero-tile .tile__label{
        border-radius:14px;
      }
      .hero-tile{ overflow:hidden; }

      .mob-col .tile,
      .mob-col .tile img,
      .mob-col .tile .tile__label{
        border-radius:9px;
      }
      .mob-col .tile{ overflow:hidden; }

      /* col-right tiles (Children's Book / Jewelry in grid row) */
      .col-right a,
      .col-right a img,
      .col-right a .tile__label{
        border-radius:9px;
      }
      .col-right a{ overflow:hidden; }

      /* Footer */
      .site-footer{ flex-direction:column; gap:20px; padding:32px 20px calc(40px + env(safe-area-inset-bottom,0px)); }
      .footer-copyright{ text-align:left; }

    
      /* Stage Art: fixed card height creates vertical crop space */
      a[href="stage-art-production.html"].tile img,
      a[href="stage-art-production.html"] img{
        object-fit:cover !important;
        object-position:center 85% !important;
      }
    }

    /* ── Side nav styles now live in nav.js ── */


  </style>

  <div id="footer"></div>

  <script src="footer.js"></script>
  <script>
    /* Desktop: point My Partner and Flow tiles to illustrations.html anchor */
    if (window.innerWidth >= 768) {
      document.querySelectorAll("[data-desktop-href]").forEach(function(el) {
        el.href = el.getAttribute("data-desktop-href");
      });
    }
  </script>

  <script>
  (function(){
    /* Mobile-only two-column layout
       Left col:  my-partner, childrens-book, traditional-mediums, jewelry
       Right col: stage-art-production, flow-and-spirituality, graphic-design, apparel, meditation
       Only activates at ≤767px (covers portrait + landscape mobile). */

    var LEFT  = ['my-partner.html','childrens-book.html','traditional-mediums.html','jewelry.html'];
    var RIGHT = ['stage-art-production.html','flow-and-spirituality.html','graphic-design.html','apparel.html','meditation.html'];

    function getTile(href) {
      return document.querySelector('.collage-columns a[href="' + href + '"]');
    }

    function buildMobile() {
      var cols = document.querySelector('.collage-columns');
      if (!cols) return;

      /* Remove any existing mob-cols */
      cols.querySelectorAll('.mob-col').forEach(function(el){ el.remove(); });

      /* Show original cols (needed to query tiles) */
      cols.querySelectorAll('.col-left,.col-middle,.col-right').forEach(function(el){
        el.style.display = '';
      });

      /* Create two independent column divs */
      var colL = document.createElement('div');
      var colR = document.createElement('div');
      colL.className = 'mob-col';
      colR.className = 'mob-col';

      /* Move tiles into columns in specified order */
      LEFT.forEach(function(href){
        var tile = getTile(href);
        if (tile) colL.appendChild(tile);
      });
      RIGHT.forEach(function(href){
        var tile = getTile(href);
        if (tile) colR.appendChild(tile);
      });

      /* Hide now-empty original wrappers */
      cols.querySelectorAll('.col-left,.col-middle,.col-right').forEach(function(el){
        el.style.display = 'none';
      });

      cols.appendChild(colL);
      cols.appendChild(colR);

      /* Re-apply translations after DOM restructure */
      if (window.csApplyTranslations) window.csApplyTranslations();
    }

    function destroyMobile() {
      var cols = document.querySelector('.collage-columns');
      if (!cols) return;

      /* Move tiles back to original col wrappers */
      var allCols = cols.querySelectorAll('.col-left,.col-middle,.col-right');
      allCols.forEach(function(el){ el.style.display = ''; });

      /* Move tiles back using their original parent stored in data attr,
         or simply restore from mob-col back — we stored originals by col class */
      var mobCols = cols.querySelectorAll('.mob-col');
      mobCols.forEach(function(mc){
        mc.querySelectorAll('a[href]').forEach(function(tile){
          var href = tile.getAttribute('href');
          /* Find original container */
          var origCol = cols.querySelector('.col-left a[data-href="' + href + '"]');
          /* Restore by data-orig-col attribute */
          var targetCol = cols.querySelector('.' + tile.dataset.origCol);
          if (targetCol) targetCol.appendChild(tile);
        });
        mc.remove();
      });

      /* Re-apply translations after DOM restore */
      if (window.csApplyTranslations) window.csApplyTranslations();
    }

    function storeOriginals() {
      /* Store each tile's original col class for restore */
      document.querySelectorAll('.col-left a[href], .col-middle a[href], .col-right a[href]').forEach(function(tile){
        var parent = tile.parentElement;
        if (parent.classList.contains('col-left'))   tile.dataset.origCol = 'col-left';
        if (parent.classList.contains('col-middle'))  tile.dataset.origCol = 'col-middle';
        if (parent.classList.contains('col-right'))   tile.dataset.origCol = 'col-right';
      });
    }

    var isMobile = false;

    function check() {
      var mobile = window.innerWidth <= 767 && (navigator.maxTouchPoints > 0 || window.matchMedia("(pointer:coarse)").matches);
      if (mobile && !isMobile) {
        storeOriginals();
        buildMobile();
        isMobile = true;
      } else if (!mobile && isMobile) {
        destroyMobile();
        isMobile = false;
      }
    }

    document.addEventListener('DOMContentLoaded', check);
    window.addEventListener('resize', check);

    window.addEventListener('cs-nav-ready', function() {
      if (isMobile && window.csApplyTranslations) window.csApplyTranslations();
    });
  })();
  </script>
</body>
