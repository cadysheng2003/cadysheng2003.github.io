<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cady Sheng — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Lora:ital,wght@0,400;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --font-display:'Cormorant Garamond',Georgia,serif; --font-body:'Lora',Georgia,serif; --font-ui:'Jost',sans-serif; --color-text:#2a2a2a; --color-text-light:#888; --page-max-width:960px; --page-padding:40px; }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    html{-webkit-font-smoothing:antialiased;}
    body{background:#fff;color:var(--color-text);}
    .site-header{max-width:var(--page-max-width);margin:0 auto;padding:40px var(--page-padding) 0;}
    .logo-image{display:block;width:min(744px,90vw);height:auto;margin:0 auto;}
    .tagline{font-family:var(--font-body);font-size:13.5px;font-style:italic;text-align:right;color:var(--color-text-light);margin-top:10px;letter-spacing:0.3px;}
    .collage{max-width:var(--page-max-width);margin:14px auto 0;padding:0 var(--page-padding);}
    .hero-tile{display:block;overflow:hidden;text-decoration:none;color:inherit;margin-bottom:32px;position:relative;}
    .hero-tile img{display:block;width:100%;height:auto;transition:transform 0.3s ease;}
    .hero-tile:hover img{opacity:1;transform:scale(1.04);}
    .hero-tile .tile__label{
      position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      background:rgba(0,0,0,0);color:#fff;
      font-family:var(--font-ui);font-size:18px;font-weight:500;letter-spacing:3px;text-align:center;text-transform:uppercase;
      opacity:0;transition:background 0.25s ease,opacity 0.25s ease;
      padding:16px;
    }
    .hero-tile:hover .tile__label{background:rgba(0,0,0,0.25);opacity:1;}
    .hero-tile::after{
      content:'↗';position:absolute;bottom:14px;right:16px;
      font-size:13px;color:rgba(255,255,255,0.75);
      font-family:var(--font-body);letter-spacing:0;
      transition:opacity 0.25s ease;pointer-events:none;
    }
    .hero-tile:hover::after{opacity:0;}
    .collage-columns{display:flex;gap:16px;align-items:flex-start;}
    .col-left{flex:0 0 36%;display:flex;flex-direction:column;gap:18px;}
    .col-middle{flex:0 0 32.5%;display:flex;flex-direction:column;gap:18px;}
    .col-right{flex:1;display:flex;flex-direction:column;gap:18px;}
    .tile{display:block;overflow:hidden;text-decoration:none;color:inherit;position:relative;}
    .tile img{display:block;width:100%;height:auto;transition:transform 0.3s ease;}
    .tile:hover img{opacity:1;transform:scale(1.04);}
    .tile__label{
      position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      background:rgba(0,0,0,0);color:#fff;
      font-family:var(--font-ui);font-size:15px;font-weight:500;letter-spacing:3px;text-align:center;text-transform:uppercase;
      opacity:0;transition:background 0.25s ease,opacity 0.25s ease;
      padding:12px;
    }
    .tile:hover .tile__label{background:rgba(0,0,0,0.25);opacity:1;}
    .tile::after{
      content:'↗';position:absolute;bottom:10px;right:12px;
      font-size:11px;color:rgba(255,255,255,0.75);
      font-family:var(--font-body);letter-spacing:0;
      transition:opacity 0.25s ease;pointer-events:none;
    }
    .tile:hover::after{opacity:0;}
    .connect-section{max-width:var(--page-max-width);margin:60px auto 0;padding:0 var(--page-padding);text-align:right;}
    .connect-btn{display:inline-block;font-family:var(--font-display);font-size:17px;font-weight:400;color:var(--color-text);text-decoration:none;letter-spacing:0.5px;background:#f7f5f3;padding:14px 32px;}
    .site-footer{max-width:var(--page-max-width);margin:52px auto 0;padding:32px var(--page-padding) 48px;border-top:1px solid #e8e8e8;display:flex;justify-content:space-between;align-items:flex-start;gap:40px;}
    .footer-contact p,.footer-copyright p{font-family:var(--font-body);font-size:13px;line-height:2;color:var(--color-text-light);}
    .footer-contact a{color:var(--color-text-light);text-decoration:none;border-bottom:1px solid #ddd;}
    .footer-contact a:hover{color:var(--color-text);}
    .footer-copyright{text-align:right;}
    .fade-in{opacity:0;transform:translateY(12px);animation:fadeUp 0.7s ease forwards;}
    .delay-1{animation-delay:0.15s;}.delay-2{animation-delay:0.3s;}.delay-3{animation-delay:0.45s;}
    @keyframes fadeUp{to{opacity:1;transform:translateY(0);}}
    @media(max-width:480px){

      body{ padding-left:0 !important; padding-bottom:env(safe-area-inset-bottom,20px); }

      /* ── Header ── */
      .site-header{ padding:16px 16px 0; text-align:center; }
      .logo-image{ width:min(340px,80vw) !important; min-width:0 !important; margin:0 auto; }
      .tagline{
        text-align:center; font-size:10px; letter-spacing:0.5px;
        color:#aaa; margin-top:10px; text-transform:none; font-style:italic;
      }

      /* ── Collage wrapper ── */
      .collage{ padding:0 16px; margin-top:16px; }

      /* ── Hero: 16px side margin via collage padding, 12px below ── */
      .hero-tile{
        margin-bottom:12px;
        position:relative; display:block; overflow:hidden; border-radius:2px;
      }
      .hero-tile img{ width:100%; height:auto; object-fit:unset; display:block; transition:none; }
      .hero-tile .tile__label{
        opacity:1 !important;
        transition:none !important;
        /* bottom-left: flex-end = bottom, flex-start = left */
        align-items:flex-end !important;
        justify-content:flex-start !important;
        text-align:left !important;
        background:linear-gradient(to top, rgba(0,0,0,0.48) 0%, rgba(0,0,0,0) 58%) !important;
        padding:16px 14px;
        font-size:13px; font-weight:500;
        letter-spacing:1.5px; text-transform:uppercase;
      }
      .hero-tile::after{ display:none; }

      /* ── 2-col grid: col-middle LEFT, col-left RIGHT ──
         Using CSS grid (not flex) avoids all the wrap/calc issues.
         col-right tiles shown via a separate row below.
      ── */
      .collage-columns{
        display:grid;
        grid-template-columns:1fr 1fr;
        grid-template-rows:auto;
        column-gap:10px;
        row-gap:0;
        margin-top:0;
        align-items:start;
      }

      /* Each col is a grid cell containing its own flex column */
      .col-middle{
        grid-column:1; grid-row:1;
        display:flex !important; flex-direction:column;
        gap:16px; min-width:0;
      }
      .col-left{
        grid-column:2; grid-row:1;
        display:flex !important; flex-direction:column;
        gap:16px; min-width:0;
      }
      /* col-right spans both columns as a 2-tile row below */
      .col-right{
        grid-column:1 / -1; grid-row:2;
        display:flex !important; flex-direction:row;
        gap:10px; margin-top:16px;
      }
      .col-right .tile{ flex:1; }

      /* ── Base tile ── */
      .tile{ display:block; position:relative; overflow:hidden; width:100%; }
      .tile::after{ display:none !important; }
      .tile img{
        width:100%; height:auto; min-height:30vw;
        object-fit:cover; object-position:center;
        display:block; transition:none; background:transparent;
      }

      /* Per-image position tuning */
      a[href="my-partner.html"].tile img{ object-position:center top; min-height:38vw; }
      a[href="stage-art-production.html"].tile img{ object-position:center center; min-height:36vw; }
      a[href="flow-and-spirituality.html"].tile img{ object-position:center center; min-height:38vw; }
      a[href="graphic-design.html"].tile img{ object-position:center top; min-height:34vw; }
      a[href="apparel.html"].tile img{ object-position:center top; min-height:34vw; }
      a[href="childrens-book.html"].tile img{ object-position:center top; min-height:36vw; }
      a[href="jewelry.html"].tile img{ object-fit:contain; background:transparent; min-height:28vw; }

      /* ── Labels: all bottom-left, unified system ── */
      .tile .tile__label,
      .tile--large .tile__label,
      .tile--medium .tile__label,
      .tile--small .tile__label{
        opacity:1 !important;
        transition:none !important;
        /* Unified bottom-left positioning */
        align-items:flex-end !important;
        justify-content:flex-start !important;
        text-align:left !important;
        /* Subtle gradient: dark at bottom, fades up — readable but not heavy */
        background:linear-gradient(to top, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0) 58%) !important;
        /* Consistent 14px padding matches page margin system */
        padding:14px 14px;
        font-size:11px;
        font-weight:500;
        letter-spacing:1px;
        text-transform:uppercase;
        color:#fff;
      }

      /* ── Footer ── */
      .site-footer{ flex-direction:column; gap:20px; padding:32px 20px calc(40px + env(safe-area-inset-bottom,0px)); }
      .footer-copyright{ text-align:left; }

    }
    /* ── Side nav styles now live in nav.js ── */

  </style>
  <script src="nav.js"></script>
</head>
<body>

  <header class="site-header fade-in">
    <img src="homepage-covers-images/CadyShengLogo.jpg" alt="Cady Sheng" class="logo-image">
    <p class="tagline">Truth, Love, Flow, Oneness</p>
  </header>

  <section class="collage fade-in delay-2">
    <!-- Hero: Illustrations full width -->
    <a href="illustrations.html" class="hero-tile">
      <img src="homepage-covers-images/IllustrationsCover.jpg" alt="Illustrations" loading="lazy">
      <span class="tile__label">Illustrations</span>
    </a>
    <div class="collage-columns">
      <!-- col-middle = mobile LEFT column (grid-column:1) -->
      <!-- Mobile order: Stage Art(2), Traditional Mediums(4), Children's Book(6), Apparel(8) -->
      <div class="col-middle">
        <a href="stage-art-production.html" class="tile tile--large">
          <img src="homepage-covers-images/SPCover.jpg" alt="Stage Art &amp; Production" loading="lazy">
          <span class="tile__label">Stage Art &amp; Production</span>
        </a>
        <a href="traditional-mediums.html" class="tile tile--medium">
          <img src="homepage-covers-images/TMCover.jpg" alt="Traditional Mediums" loading="lazy">
          <span class="tile__label">Traditional Mediums</span>
        </a>
        <a href="childrens-book.html" class="tile tile--large">
          <img src="homepage-covers-images/CBCover.jpg" alt="Children&#8217;s Book" loading="lazy">
          <span class="tile__label">Children&#8217;s Book</span>
        </a>
        <a href="apparel.html" class="tile tile--small">
          <img src="homepage-covers-images/ACover.jpg" alt="Apparel" loading="lazy">
          <span class="tile__label">Apparel</span>
        </a>
      </div>
      <!-- col-left = mobile RIGHT column (grid-column:2) -->
      <!-- Mobile order: Flow & Spirituality(3), Graphic Design(5), My Partner(7) -->
      <div class="col-left">
        <a href="flow-and-spirituality.html" class="tile tile--large">
          <img src="homepage-covers-images/SCover.jpg" alt="Flow &amp; Spirituality" loading="lazy">
          <span class="tile__label">Flow &amp; Spirituality</span>
        </a>
        <a href="graphic-design.html" class="tile tile--medium">
          <img src="homepage-covers-images/GDCover.jpg" alt="Graphic Design" loading="lazy">
          <span class="tile__label">Graphic Design</span>
        </a>
        <a href="my-partner.html" class="tile tile--large">
          <img src="homepage-covers-images/MPCover.jpg" alt="My Partner" loading="lazy">
          <span class="tile__label">My Partner</span>
        </a>
      </div>
      <!-- col-right = mobile bottom full-width row (grid-column:1/-1) -->
      <!-- Mobile order: Jewelry(9), Meditation(10) -->
      <div class="col-right">
        <a href="jewelry.html" class="tile tile--small">
          <img src="homepage-covers-images/JCover.jpg" alt="Jewelry" loading="lazy">
          <span class="tile__label">Jewelry</span>
        </a>
        <a href="meditation.html" class="tile tile--small">
          <img src="homepage-covers-images/MCover.jpg" alt="Meditation" loading="lazy">
          <span class="tile__label">Meditation</span>
        </a>
      </div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="footer.js"></script>
</body>
